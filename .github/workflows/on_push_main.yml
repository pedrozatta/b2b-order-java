name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build, test and verify coverage (>= 70%)
        run: ./gradlew clean build jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Publish coverage summary
        if: always()
        run: |
          REPORT="build/reports/jacoco/test/jacocoTestReport.xml"
          if [ ! -f "$REPORT" ]; then
            echo "Coverage report not found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          counters = {c.get("type"): c for c in root.findall("counter")}

          def pct(counter_type: str) -> str:
              counter = counters.get(counter_type)
              if counter is None:
                  return "N/A"
              missed = int(counter.get("missed", 0))
              covered = int(counter.get("covered", 0))
              total = missed + covered
              if total == 0:
                  return "0.0%"
              return f"{(covered * 100 / total):.1f}% ({covered}/{total})"

          print("## Coverage")
          print()
          print("| Metric | Value |")
          print("|---|---|")
          print(f"| Instructions | {pct('INSTRUCTION')} |")
          print(f"| Branches | {pct('BRANCH')} |")
          print(f"| Lines | {pct('LINE')} |")
          print(f"| Methods | {pct('METHOD')} |")
          print(f"| Classes | {pct('CLASS')} |")
          print()
          print("Relatório completo disponível no artifact `jacoco-report`.")
          PY

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/test/html/
            build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn
