services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b2b_order
      POSTGRES_USER: b2b
      POSTGRES_PASSWORD: b2b
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b -d b2b_order"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/b2b_order
      SPRING_DATASOURCE_USERNAME: b2b
      SPRING_DATASOURCE_PASSWORD: b2b
    depends_on:
      postgres:
        condition: service_healthy
