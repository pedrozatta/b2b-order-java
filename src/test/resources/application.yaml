spring:
  datasource:
    url: jdbc:h2:mem:b2b-order-test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: false

app:
  security:
    user:
      username: admin
      password: admin123
