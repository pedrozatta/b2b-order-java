spring:
  application:
    name: b2b-order-java
  flyway:
    locations: classpath:db/migration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/b2b_order}
    username: ${SPRING_DATASOURCE_USERNAME:b2b}
    password: ${SPRING_DATASOURCE_PASSWORD:b2b}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}

app:
  security:
    user:
      username: admin
      password: admin123

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
